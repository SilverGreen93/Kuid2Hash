name: CI

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]  # 3.10 is the floor from requires-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package + tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
