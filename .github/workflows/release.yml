name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system deps for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package + tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: exe
            upload: dist/*.zip   # both exes ship inside the zip, not loose
          - os: macos-14
            artifact: dmg
          - os: ubuntu-22.04
            artifact: deb
          - os: ubuntu-22.04
            artifact: zst

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruby (for fpm) + build tools  # linux packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential libarchive-tools rpm
          sudo gem install --no-document fpm

      - name: Install Python build deps
        run: python -m pip install --upgrade pip ".[gui,build]"

      - name: Build ${{ matrix.artifact }}
        run: python build.py --only ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: kuid2hash-${{ matrix.artifact }}
          path: ${{ matrix.upload || 'dist/*' }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: kuid2hash-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
